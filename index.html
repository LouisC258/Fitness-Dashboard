<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 減肥與餐飲開支 Dashboard</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --input: #0f172a; --text: #f8fafc; --muted: #94a3b8; --accent: #10b981; --blue: #38bdf8; --warn: #fbbf24; --danger: #ef4444; --border: #334155; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1050px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .btn { background: var(--accent); color: #052e16; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: opacity 0.2s; white-space: nowrap; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-blue { background: var(--blue); color: #082f49; }
    .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
    .card-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .card-value { font-size: 26px; font-weight: 700; color: var(--accent); }
    .progress-bg { width: 100%; height: 6px; background: var(--input); border-radius: 999px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
    .quick-steps-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--muted); }
    input, select { background: var(--input); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    #login-screen { text-align: center; padding: 70px 20px; max-width: 480px; margin: 60px auto; }
    .hidden { display: none !important; }
    .status-msg { font-size: 13px; margin-left: 8px; color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登入畫面 -->
    <div id="login-screen" class="card">
      <h2 style="margin-top:0;">🔒 私人減肥與餐飲理財 Dashboard</h2>
      <p style="color: var(--muted); font-size: 14px; margin-bottom: 28px;">已綁定「2026 減肥 Daily Log」及安全寫入通道</p>
      <button class="btn" style="width:100%; padding:14px; font-size:15px;" onclick="handleAuthClick()">使用 Google 帳號登入</button>
    </div>

    <!-- 主儀表板 -->
    <div id="dashboard" class="hidden">
      <div class="header">
        <div>
          <h2 style="margin:0;">📊 2026 減肥與開支追蹤</h2>
          <span style="font-size:12px; color:var(--muted);" id="last-updated">資料同步中...</span>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" onclick="fetchSheetData()">🔄 重新整理</button>
          <button class="btn btn-outline" onclick="handleSignoutClick()">登出</button>
        </div>
      </div>

      <!-- KPI 卡片 -->
      <div class="grid" style="margin-bottom:0;">
        <div class="card">
          <div class="card-title"><span>攝取熱量</span><span id="target-date-label">目標 2,000</span></div>
          <div class="card-value" id="kpi-cal">- kcal</div>
          <div class="progress-bg"><div class="progress-fill" id="bar-cal" style="width:0%;"></div></div>
        </div>
        <div class="card">
          <div class="card-title"><span>蛋白質</span><span>目標 140g</span></div>
          <div class="card-value" id="kpi-pro">- g</div>
          <div class="progress-bg"><div class="progress-fill" id="bar-pro" style="width:0%;"></div></div>
        </div>
        <div class="card">
          <div class="card-title"><span>步數</span><span>目標 9,000</span></div>
          <div class="card-value" id="kpi-steps">-</div>
          <div class="progress-bg"><div class="progress-fill" id="bar-steps" style="width:0%;"></div></div>
        </div>
        <div class="card">
          <div class="card-title"><span>累積餐飲總花費</span><span>HKD</span></div>
          <div class="card-value" style="color:var(--warn);" id="kpi-cost">$0</div>
          <div style="font-size:12px; color:var(--muted); margin-top:8px;" id="avg-daily-cost">日均餐費：$0</div>
        </div>
      </div>

      <!-- 獨立快速更新步數區塊 -->
      <div class="card" style="padding: 16px 20px;">
        <form id="quick-steps-form" class="quick-steps-bar" onsubmit="handleQuickStepsSubmit(event)">
          <div class="form-group" style="flex: 0 0 160px;">
            <label>🚶 快速更新步數（日期）</label>
            <input type="date" id="qs-date" required />
          </div>
          <div class="form-group" style="flex: 1; min-width: 160px;">
            <label>當日總步數</label>
            <input type="number" id="qs-steps" placeholder="例如：10981" min="1" required />
          </div>
          <button type="submit" class="btn btn-blue" id="qs-btn" style="height: 40px;">🚶 更新步數</button>
          <span id="qs-status" class="status-msg" style="align-self: center;"></span>
        </form>
      </div>

      <!-- 快速手動新增飲食表單 -->
      <div class="card">
        <h3 style="margin-top:0; margin-bottom:16px;">✍️ 快速手動新增飲食記錄</h3>
        <form id="entry-form" onsubmit="handleFormSubmit(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>日期</label>
              <input type="date" id="f-date" required />
            </div>
            <div class="form-group">
              <label>餐次</label>
              <select id="f-meal">
                <option value="早餐">早餐</option>
                <option value="午餐">午餐</option>
                <option value="下午茶">下午茶</option>
                <option value="晚餐">晚餐</option>
                <option value="宵夜">宵夜</option>
                <option value="加餐/小食">加餐/小食</option>
                <option value="飲品">飲品</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>食物內容</label>
              <input type="text" id="f-food" placeholder="例如：無糖可樂 1罐 / 烚蛋兩隻" required />
            </div>
            <div class="form-group">
              <label>卡路里 (kcal)</label>
              <input type="number" id="f-cal" placeholder="0" min="0" />
            </div>
            <div class="form-group">
              <label>蛋白質 (g)</label>
              <input type="number" id="f-pro" placeholder="0" min="0" step="0.1" />
            </div>
            <div class="form-group">
              <label>碳水 (g)</label>
              <input type="number" id="f-carb" placeholder="0" min="0" step="0.1" />
            </div>
            <div class="form-group">
              <label>脂肪 (g)</label>
              <input type="number" id="f-fat" placeholder="0" min="0" step="0.1" />
            </div>
            <div class="form-group">
              <label>花費 (HKD)</label>
              <input type="number" id="f-cost" placeholder="0" min="0" step="0.1" />
            </div>
            <div class="form-group">
              <label>今日步數（可選）</label>
              <input type="number" id="f-steps" placeholder="例如：10981" min="0" />
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>備註 (Remarks)</label>
              <input type="text" id="f-remarks" placeholder="例如：走汁、少飯、7-11買" />
            </div>
          </div>
          <div style="margin-top:16px; display:flex; align-items:center;">
            <button type="submit" class="btn" id="submit-btn">➕ 寫入 Google Sheet</button>
            <span id="form-status" class="status-msg"></span>
          </div>
        </form>
      </div>

      <!-- 圖表區 -->
      <div class="card">
        <canvas id="calorieChart" height="95"></canvas>
      </div>

      <!-- 最近飲食記錄 -->
      <div class="card" style="overflow-x:auto;">
        <h3 style="margin-top:0;">最近飲食明細</h3>
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>餐次</th>
              <th>食物內容</th>
              <th>熱量</th>
              <th>蛋白質</th>
              <th>花費</th>
              <th>步數</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="log-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '86281111190-ehfhj4sc4ve16iq3bu16ovbhdbe5ot78.apps.googleusercontent.com';
    const SPREADSHEET_ID = '1WhufyrcY3t-X_7XoqpevEGQhua-ar9AHIxG01Napiho';
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwudHI5gZHzZf7WS9F9D4v8ZQ2jWrC-7lhCgEKIv2quXpiJPLZWYe0sYr93bz-QjAg/exec';
    const SECRET_TOKEN = 'Louis_Fit_2026_SecretKey_9988';
    const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly';

    const TARGET_CAL = 2000;
    const TARGET_PRO = 140;
    const TARGET_STEPS = 9000;

    let tokenClient = null;
    let accessToken = null;
    let chartInstance = null;

    function parseNum(val) {
      if (val === undefined || val === null || val === '') return 0;
      const cleaned = String(val).replace(/[^0-9.-]+/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    }

    window.onload = () => {
      const tzOffset = (new Date()).getTimezoneOffset() * 60000;
      const todayISO = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
      document.getElementById('f-date').value = todayISO;
      document.getElementById('qs-date').value = todayISO;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            fetchSheetData();
          }
        },
      });
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function handleSignoutClick() {
      if (accessToken) {
        google.accounts.oauth2.revoke(accessToken);
        accessToken = null;
      }
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // 獨立快速更新步數
    async function handleQuickStepsSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('qs-btn');
      const status = document.getElementById('qs-status');
      const stepsVal = Number(document.getElementById('qs-steps').value);
      if (!stepsVal || stepsVal <= 0) return;

      btn.disabled = true;
      status.style.color = '#94a3b8';
      status.innerText = '更新中...';

      const payload = {
        token: SECRET_TOKEN,
        date: document.getElementById('qs-date').value,
        meal: '',
        food: '🚶 步數更新',
        cal: 0,
        pro: 0,
        carb: 0,
        fat: 0,
        cost: 0,
        steps: stepsVal,
        remarks: 'Dashboard 快速更新步數'
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          status.style.color = '#10b981';
          status.innerText = `✅ 已更新 ${stepsVal.toLocaleString()} 步！`;
          document.getElementById('qs-steps').value = '';
          await fetchSheetData();
          setTimeout(() => { status.innerText = ''; }, 3000);
        } else {
          status.style.color = '#ef4444';
          status.innerText = '更新失敗：' + (result.message || '未知錯誤');
        }
      } catch (err) {
        console.error(err);
        status.style.color = '#ef4444';
        status.innerText = '連線錯誤';
      } finally {
        btn.disabled = false;
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('form-status');
      btn.disabled = true;
      status.style.color = '#94a3b8';
      status.innerText = '正在寫入...';

      const payload = {
        token: SECRET_TOKEN,
        date: document.getElementById('f-date').value,
        meal: document.getElementById('f-meal').value,
        food: document.getElementById('f-food').value.trim(),
        cal: document.getElementById('f-cal').value ? Number(document.getElementById('f-cal').value) : 0,
        pro: document.getElementById('f-pro').value ? Number(document.getElementById('f-pro').value) : 0,
        carb: document.getElementById('f-carb').value ? Number(document.getElementById('f-carb').value) : 0,
        fat: document.getElementById('f-fat').value ? Number(document.getElementById('f-fat').value) : 0,
        cost: document.getElementById('f-cost').value ? Number(document.getElementById('f-cost').value) : 0,
        steps: document.getElementById('f-steps').value ? Number(document.getElementById('f-steps').value) : '',
        remarks: document.getElementById('f-remarks').value.trim()
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          status.style.color = '#10b981';
          status.innerText = '✅ 已成功寫入！';
          ['f-food', 'f-cal', 'f-pro', 'f-carb', 'f-fat', 'f-cost', 'f-remarks'].forEach(id => document.getElementById(id).value = '');
          await fetchSheetData();
          setTimeout(() => { status.innerText = ''; }, 3000);
        } else {
          status.style.color = '#ef4444';
          status.innerText = '寫入失敗：' + (result.message || '未知錯誤');
        }
      } catch (err) {
        console.error(err);
        status.style.color = '#ef4444';
        status.innerText = '連線錯誤，請檢查網路';
      } finally {
        btn.disabled = false;
      }
    }

    async function fetchSheetData() {
      if (!accessToken) return;
      try {
        const range = encodeURIComponent("'Daily Log'!A4:J500");
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (data.error) {
          alert('讀取失敗：' + data.error.message);
          return;
        }
        renderDashboard(data.values || []);
        document.getElementById('last-updated').innerText = '最後同步：' + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
      }
    }

    function renderDashboard(rows) {
      const validRows = rows.filter(r => r[0] && /^\d{4}-\d{2}-\d{2}/.test(String(r[0]).trim()) && r[2]);
      const tzOffset = (new Date()).getTimezoneOffset() * 60000;
      const todayStr = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);

      let todayCal = 0, todayPro = 0, todaySteps = 0, totalCost = 0;
      const dailyMap = {};

      validRows.forEach(r => {
        const date = String(r[0]).trim();
        const cal = parseNum(r[3]);
        const cost = parseNum(r[7]);

        totalCost += cost;
        if (!dailyMap[date]) dailyMap[date] = { cal: 0, cost: 0 };
        dailyMap[date].cal += cal;
        dailyMap[date].cost += cost;
      });

      const dates = Object.keys(dailyMap).sort();
      const targetDate = dailyMap[todayStr] ? todayStr : dates[dates.length - 1];
      if (targetDate) {
        document.getElementById('target-date-label').innerText = `${targetDate} (目標 ${TARGET_CAL})`;
        validRows.filter(r => String(r[0]).trim() === targetDate).forEach(r => {
          todayCal += parseNum(r[3]);
          todayPro += parseNum(r[4]);
          const s = Math.round(parseNum(r[8]));
          if (s > todaySteps) todaySteps = s;
        });
      }

      const kpiCalEl = document.getElementById('kpi-cal');
      const barCalEl = document.getElementById('bar-cal');
      kpiCalEl.innerText = `${Math.round(todayCal).toLocaleString()} kcal`;
      kpiCalEl.style.color = todayCal > TARGET_CAL ? 'var(--danger)' : 'var(--accent)';
      barCalEl.style.width = `${Math.min(100, (todayCal / TARGET_CAL) * 100)}%`;
      barCalEl.style.background = todayCal > TARGET_CAL ? 'var(--danger)' : 'var(--accent)';

      document.getElementById('kpi-pro').innerText = `${Math.round(todayPro)} g`;
      document.getElementById('bar-pro').style.width = `${Math.min(100, (todayPro / TARGET_PRO) * 100)}%`;

      document.getElementById('kpi-steps').innerText = todaySteps.toLocaleString();
      document.getElementById('bar-steps').style.width = `${Math.min(100, (todaySteps / TARGET_STEPS) * 100)}%`;

      document.getElementById('kpi-cost').innerText = `$${Math.round(totalCost).toLocaleString()}`;
      const avgCost = dates.length > 0 ? Math.round(totalCost / dates.length) : 0;
      document.getElementById('avg-daily-cost').innerText = `日均餐費：$${avgCost}`;

      const tbody = document.getElementById('log-table-body');
      tbody.innerHTML = validRows.slice().reverse().slice(0, 20).map(r => {
        const calNum = parseNum(r[3]);
        const proNum = parseNum(r[4]);
        const costNum = parseNum(r[7]);
        const stepsNum = Math.round(parseNum(r[8]));
        return `
          <tr>
            <td>${r[0] || ''}</td>
            <td>${r[1] || '-'}</td>
            <td>${r[2] || ''}</td>
            <td>${calNum.toLocaleString()} kcal</td>
            <td>${proNum} g</td>
            <td>$${costNum}</td>
            <td>${stepsNum > 0 ? stepsNum.toLocaleString() : '-'}</td>
            <td style="color:var(--muted);">${r[9] || ''}</td>
          </tr>
        `;
      }).join('');

      const ctx = document.getElementById('calorieChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dates,
          datasets: [
            {
              label: '每日總熱量 (kcal)',
              data: dates.map(d => dailyMap[d].cal),
              backgroundColor: dates.map(d => dailyMap[d].cal > TARGET_CAL ? 'rgba(239, 68, 68, 0.75)' : 'rgba(16, 185, 129, 0.7)'),
              yAxisID: 'y'
            },
            {
              label: '2,000 kcal 目標線',
              data: dates.map(() => TARGET_CAL),
              type: 'line',
              borderColor: '#94a3b8',
              borderDash: [5, 5],
              pointRadius: 0,
              fill: false,
              yAxisID: 'y'
            },
            {
              label: '每日餐費 (HKD)',
              data: dates.map(d => dailyMap[d].cost),
              type: 'line',
              borderColor: '#fbbf24',
              backgroundColor: '#fbbf24',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: { type: 'linear', position: 'left', ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y1: { type: 'linear', position: 'right', ticks: { color: '#fbbf24' }, grid: { drawOnChartArea: false } },
            x: { ticks: { color: '#94a3b8' } }
          },
          plugins: { legend: { labels: { color: '#f8fafc' } } }
        }
      });
    }
  </script>
</body>
</html>
